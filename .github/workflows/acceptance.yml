name: linux acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: setup
        run: ./scripts/setup.sh
      - name: start
        run: ./scripts/start.sh
      - name: status
        run: ./scripts/status.sh
      - name: health
        run: curl -fsS http://127.0.0.1:8000/api/health/
      - name: backup
        run: ./scripts/backup.sh
      - name: stop
        run: ./scripts/stop.sh
      - name: collect logs
        if: always()
        run: |
          echo "=== server.out.log ==="; tail -n 80 data/logs/server.out.log 2>/dev/null || true
          echo "=== server.err.log ==="; tail -n 80 data/logs/server.err.log 2>/dev/null || true
