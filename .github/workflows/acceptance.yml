name: cross-platform acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: setup
        run: ./scripts/setup.sh
      - name: start
        run: ./scripts/start.sh
      - name: status
        run: ./scripts/status.sh
      - name: health
        run: curl -fsS http://127.0.0.1:8000/api/health/
      - name: backup
        run: ./scripts/backup.sh
      - name: stop
        run: ./scripts/stop.sh
      - name: collect logs
        if: always()
        run: |
          echo "=== server.out.log ==="; tail -n 80 data/logs/server.out.log 2>/dev/null || true
          echo "=== server.err.log ==="; tail -n 80 data/logs/server.err.log 2>/dev/null || true

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      BIXI_SKIP_ADMIN_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: setup
        shell: pwsh
        run: |
          try {
            & ./scripts/setup.ps1
          } catch {
            Write-Host "::error::setup failed: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            exit 1
          }
      - name: start
        shell: pwsh
        run: |
          try { & ./scripts/start.ps1 } catch { Write-Host "::error::start failed: $($_.Exception.Message)"; Write-Host $_.ScriptStackTrace; exit 1 }
      - name: status
        shell: pwsh
        run: |
          try { & ./scripts/status.ps1 } catch { Write-Host "::error::status failed: $($_.Exception.Message)"; exit 1 }
      - name: health
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri http://127.0.0.1:8000/api/health/ -TimeoutSec 10
          $response | ConvertTo-Json -Compress
      - name: backup
        shell: pwsh
        run: |
          try { & ./scripts/backup.ps1 } catch { Write-Host "::error::backup failed: $($_.Exception.Message)"; exit 1 }
      - name: stop
        shell: pwsh
        run: |
          try { & ./scripts/stop.ps1 } catch { Write-Host "::error::stop failed: $($_.Exception.Message)"; exit 1 }
      - name: collect logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem data\logs\*.log -ErrorAction SilentlyContinue | ForEach-Object {
            "=== $($_.Name) ==="
            Get-Content $_.FullName -Tail 80
          }
